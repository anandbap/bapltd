name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:

# Validation only. Publishing is exclusively in the gated release workflow.
permissions:
  contents: read

# Superseded pull-request runs are cancelled; release qualification is retained.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local
  GOPROXY: ${{ vars.BAP_GO_PROXY || 'off' }}
  GOSUMDB: ${{ vars.BAP_GO_SUMDB || 'off' }}
  PIP_INDEX_URL: ${{ vars.BAP_PYPI_INDEX }}
  PIP_EXTRA_INDEX_URL: ''

jobs:
  test-go:
    name: Go Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'bap-controlplane/go.mod'
          cache-dependency-path: '**/go.sum'

      - name: Test BAP Edge
        shell: bash
        run: |
          cd bap-edge
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            go test -v -timeout=5m ./...
          else
            go test -v -race -timeout=5m ./...
          fi

      - name: Test BAP Control Plane
        shell: bash
        run: |
          cd bap-controlplane
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            go test -v -timeout=5m ./...
          else
            go test -v -race -timeout=5m ./...
          fi

      - name: Test native hooks
        shell: bash
        run: |
          cd cchook
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            go test -v -timeout=5m ./...
          else
            go test -v -race -timeout=5m ./...
          fi

      - name: Test gateway and Copilot adapter
        shell: bash
        run: |
          for module in bap-gateway copilot; do
            if [ "${{ matrix.os }}" = "windows-latest" ]; then
              (cd "$module" && go test -v -timeout=5m ./...) || exit 1
            else
              (cd "$module" && go test -v -race -timeout=5m ./...) || exit 1
            fi
          done

      - name: Test onboarding probe protocol end to end
        working-directory: bap-controlplane
        env:
          BAP_TELEMETRY_E2E: '1'
        run: go test ./internal/api -run '^TestOnboardingProbeWireEndToEnd$' -count=1 -timeout=90s

      - name: Test recommendation transport and durable restart with matching binaries
        shell: bash
        run: |
          EXT=""
          if [ "${{ matrix.os }}" = "windows-latest" ]; then EXT=".exe"; fi
          CONTROLPLANE_BIN="$RUNNER_TEMP/bap-recommendation-controlplane$EXT"
          go -C bap-controlplane build -o "$CONTROLPLANE_BIN" ./cmd/server
          BAP_RECOMMENDATION_E2E=1 BAP_CONTROLPLANE_TEST_BIN="$CONTROLPLANE_BIN" go -C bap-edge test ./cmd -run '^TestRecommendationWireEndToEnd$' -count=1 -timeout=90s

      - name: Set up Node for dashboard contract tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test dashboard controls and discovery
        run: |
          node tests/test_v3_controls.cjs
          node tests/test_v3_discovery.cjs
          node tests/test_activity_metrics.cjs
          node tests/test_v3_admin.cjs

  test-python:
    name: Python Integration & E2E Suites
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'bap-controlplane/go.mod'
          cache-dependency-path: '**/go.sum'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        shell: pwsh
        run: |
          if (-not $env:PIP_INDEX_URL) { throw 'Configure BAP_PYPI_INDEX with the approved corporate mirror' }
          python -m pip install --upgrade pip build setuptools wheel
          pip install -r requirements-test.txt

      - name: Build Windows amd64 Binaries
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "dist\windows-amd64\claude-client" -Force | Out-Null
          & .\update_binaries.ps1 -AllowDevOverrides "false"
          Push-Location cchook
          go build -ldflags "-s -w -X 'main.AllowDevOverrides=false'" -o interceptor.exe .
          Copy-Item -Force interceptor.exe ..\interceptor.exe
          Copy-Item -Force interceptor.exe ..\cchook-interceptor.exe
          Copy-Item -Force interceptor.exe ..\dist\windows-amd64\interceptor.exe
          Copy-Item -Force interceptor.exe ..\dist\windows-amd64\cchook-interceptor.exe
          Copy-Item -Force interceptor.exe ..\dist\windows-amd64\claude-client\interceptor.exe
          Pop-Location

      - name: Build Universal Multi-OS Python Distribution Packages (Wheel & sdist)
        run: |
          python scripts/build_wheel.py --universal

      - name: Run Full Python Test Suite (100+ Tests)
        timeout-minutes: 10
        env:
          BAP_REQUIRE_WHEEL_TESTS: '1'
          # Legacy integration fixtures explicitly qualify content-enabled capture. Default
          # metadata privacy has separate Go transport, spool, replay and ingress regressions.
          BAP_TELEMETRY_CONTENT: redacted
          # `unittest discover` does not load tests/conftest.py (only pytest does), so give the whole
          # suite its own state directory here. Without it the tests share one policy cache / pinned
          # key / audit log, and one test's enrollment fails the next test's bapedge closed.
          BAP_STATE_DIR: ${{ runner.temp }}\bap-ci-state
        run: |
          python -X faulthandler -m unittest discover -v tests

      - name: Check product capability claims
        run: python scripts/check_capability_claims.py

      - name: Upload Windows AMD64 Executables & Distributions
        uses: actions/upload-artifact@v4
        with:
          name: bap-windows-amd64-executables
          path: |
            bapedge.exe
            bap.exe
            interceptor.exe
            bapcontrolplane.exe
            bapdashboard.exe
            bapgateway.exe
            bapmcp.exe
            dist/windows-amd64/*.exe
            dist/*.whl
            dist/*.tar.gz
          retention-days: 14
