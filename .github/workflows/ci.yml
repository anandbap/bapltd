name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-go:
    name: Go Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Test BAP Edge
        run: |
          cd bap-edge
          go test -v -race ./...

      - name: Test BAP Control Plane
        run: |
          cd bap-controlplane
          go test -v -race ./...

  test-python:
    name: Python Integration & E2E Suites
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Build Windows amd64 Binaries
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "dist\windows-amd64\claude-client" -Force | Out-Null
          & .\update_binaries.ps1
          Push-Location cchook
          go build -o interceptor.exe interceptor.go
          Copy-Item -Force interceptor.exe ..\dist\windows-amd64\interceptor.exe
          Copy-Item -Force interceptor.exe ..\dist\windows-amd64\claude-client\interceptor.exe
          Pop-Location

      - name: Run Full Python Test Suite (100+ Tests)
        run: |
          python -m unittest discover tests

      - name: Upload Windows AMD64 Executables
        uses: actions/upload-artifact@v4
        with:
          name: bap-windows-amd64-executables
          path: |
            bapedge.exe
            bapcontrolplane.exe
            bapdashboard.exe
            bapgateway.exe
            bapmcp.exe
            dist/windows-amd64/*.exe
          retention-days: 14
